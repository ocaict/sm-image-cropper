<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Image Resizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: http:;">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Ultra-Aggressive Drag-and-Drop Shield -->
    <script>
      (function() {
        const kill = (e) => {
          e.preventDefault();
        };
        
        window.addEventListener('dragenter', kill, true);
        window.addEventListener('dragover', kill, true);
        window.addEventListener('drop', kill, true);
        
        document.addEventListener('dragenter', kill, true);
        document.addEventListener('dragover', kill, true);
        document.addEventListener('drop', kill, true);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
